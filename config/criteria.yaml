# config/criteria.yaml
#
# Committed, not gitignored — criteria are neither secret nor personal, and
# committing them is what makes "why did I stop seeing infra postings?"
# answerable with `git log` (principle 3, docs/09-configuration.md).
#
# Schema: src/prefilter/domain/criteria.ts
# Rules and thresholds reasoned through in ADR-011.

# What the scheduled collection cycle asks Gupy for (principle 3: search
# strategy is data, not code). Before this section existed the cron issued a
# single empty query and got 380 mostly-Sao Paulo senior roles, of which the
# pre-filter correctly discarded 95% -- ADR-011 predicted exactly that
# ("geography is cheaper to filter at the source than after downloading it").
#
# Narrow on purpose: Rio de Janeiro or remote, matching CLAUDE.md 6. Both the
# masculine and feminine job terms are listed because Gupy matches the query
# string literally -- "estagiario" does not find "Pessoa Estagiaria".
#
# Every Gupy query below also sends `type: vacancy_type_internship`
# (added 2026-08-23). Measured live against Gupy's own API before adding,
# at the real 50-per-query cap (`GupyCollector`'s `DEFAULT_MAX_RESULTS`)
# production actually runs at, for all six Rio/remote title queries above:
# adding the type filter drops 27 non-internship rows that were consuming
# slots within that cap (10 `vacancy_type_effective`, a permanent hire, not
# an internship; 17 `vacancy_type_talent_pool`) and **zero** rows that were
# genuinely `vacancy_type_internship` -- the filter is safe, it never
# excludes a real internship. Freeing those 27 slots let 10 postings that
# were previously past position 50 (and therefore never fetched at all)
# fit inside the cap instead. One of the ten is a real, on-track,
# currently-missed posting: "Estagiário DevOps", Anbima's own 2026
# internship program, Rio de Janeiro, classifies `automation`. This is a
# genuine discovery gain, not only the cost saving originally assumed here
# -- corrected after measuring, not left as the first guess.
collection:
  queries:
    - source: gupy
      type: vacancy_type_internship
      jobName: estágio
      city: Rio de Janeiro
    - source: gupy
      type: vacancy_type_internship
      jobName: estágio
      isRemoteWork: true
    - source: gupy
      type: vacancy_type_internship
      jobName: estagiário
      city: Rio de Janeiro
    - source: gupy
      type: vacancy_type_internship
      jobName: estagiário
      isRemoteWork: true
    - source: gupy
      type: vacancy_type_internship
      jobName: estagiária
      city: Rio de Janeiro
    - source: gupy
      type: vacancy_type_internship
      jobName: estagiária
      isRemoteWork: true
    # Niteroi and Sao Goncalo are already accepted by the location rule, but
    # nothing was asking the source for them -- being allowed through the
    # filter is useless if the query never brings them back.
    - source: gupy
      type: vacancy_type_internship
      jobName: estágio
      city: Niterói
    - source: gupy
      type: vacancy_type_internship
      jobName: estagiário
      city: Niterói
    - source: gupy
      type: vacancy_type_internship
      jobName: estágio
      city: São Gonçalo
    - source: gupy
      type: vacancy_type_internship
      jobName: estagiário
      city: São Gonçalo
    # The remaining 7 cities `location.cities` accepts (Duque de Caxias, Nova
    # Iguaçu, Belford Roxo, São João de Meriti, Itaboraí, Maricá, Mesquita)
    # get no query of their own (docs/audit AC-023) -- measured deliberately,
    # not an oversight. Probed live against Gupy 2026-08-17, "estágio" /
    # "estagiário" / "estagiária" per city, same method probe:terms uses:
    # 13 postings returned across all 21 city x term combinations, 2 passed
    # the pre-filter, 0 classified on-track. Adding these queries would add
    # 21 requests (~30s of politeness delay) per cycle for zero measured
    # discovery benefit today. Accepted as a query gap, not a filter gap --
    # a real posting in these cities still passes the pre-filter (`location`
    # already accepts them) if a future query or another source ever
    # surfaces one; only live discovery is missing. Revisit if a real
    # posting in one of these cities is ever seen from another source.
    # Re-probed against the REMOTE facet 2026-08-26 (ADR-070), asking whether
    # a tech-specific term reaches remote postings the three generic terms
    # above do not. It does not. The three generic remote queries return 8
    # unique on-track postings between them, and every candidate is a subset:
    #
    #   estágio desenvolvimento          2 pass, 2 on-track -> 0 NEW
    #   estágio dados                    2 pass, 2 on-track -> 0 NEW
    #   estágio backend                  0 pass
    #   estágio segurança da informação  0 pass
    #
    # The precision looks excellent (2 of 2) and is worth nothing: both
    # postings already arrive via "estágio"/"estagiária". This is the same
    # result the InfoJobs re-probe gave on the same day -- a generic term
    # already exhausts a source's remote inventory, because remote listings
    # are few enough that no narrowing is needed. Check overlap, not yield,
    # before adding a remote term to any source.
    #
    # Tech terms, measured with `npm run probe:terms` before being added --
    # the number that decided each one is how many postings survive the
    # pre-filter AND classify onto a real track, not the raw count:
    #
    #   estagio desenvolvimento     28 returned,  5 pass,  5 on-track
    #   estagio backend              2 returned,  2 pass,  2 on-track
    #   estagio software            16 returned,  2 pass,  2 on-track
    #   estagiario desenvolvimento  13 returned,  3 pass,  2 on-track
    #
    # Deliberately NOT added, all measured at zero on-track: "estagio TI",
    # "estagio tecnologia", "estagio dados", "estagio programacao" (50
    # returned, 0 on-track), "estagio sistemas", "estagio suporte", "estagio
    # infraestrutura", "estagio redes", "estagio seguranca da informacao".
    # "estagio devops" and "estagio ciberseguranca" return nothing at all.
    # A term that returns volume and no on-track posting spends Stage A
    # budget to be discarded -- the exact failure ADR-018 fixed.
    #
    # No city/isRemoteWork on these: the term itself is already narrow (2-28
    # results nationwide, against 380 for a bare "estagio"), so constraining
    # geography here would mostly return nothing. The pre-filter handles the
    # location axis for them.
    - source: gupy
      type: vacancy_type_internship
      jobName: estágio desenvolvimento
    - source: gupy
      type: vacancy_type_internship
      jobName: estagiário desenvolvimento
    - source: gupy
      type: vacancy_type_internship
      jobName: estágio backend
    - source: gupy
      type: vacancy_type_internship
      jobName: estágio software
    # --- CIEE (ADR-021) ---------------------------------------------------
    # ONE query, deliberately. CIEE ignores every filter parameter, so its
    # collector fetches the whole board (~58 requests) and filters in memory.
    # A second CIEE query would mean a second full sweep for nothing.
    #
    # No `city` either: geography is left to the pre-filter, which already
    # holds the metro list. Storing the nationwide superior-level intake
    # costs SQLite rows and nothing else -- the pre-filter still gates what
    # reaches Stage A, so the paid work is unchanged -- and it gives M10's
    # market analysis a national picture instead of a Rio-shaped one.
    - source: ciee
    # --- InfoJobs (discovery 2026-08-23, ADR-063) ---------------------------
    # Server-rendered HTML, no JSON API found. Location is a friendly-URL
    # suffix (`vagas-de-emprego-{termo}-{cidade}.aspx` or `-trabalho-home-
    # office.aspx` for remote), found by reading the real facet links'
    # `data-url` attributes -- the legacy `?provincia=`-style query param
    # silently returns the unfiltered nationwide set.
    #
    # Both `estagio` and `estagiario` are listed, same reason Gupy's own
    # queries list every gender/inflection: InfoJobs matches close to
    # literally, and each term returned a different, only partly
    # overlapping result set when measured. `estagiaria ti` was also tried
    # and returned the exact same 4 postings `estagio ti` already covers --
    # not added, redundant.
    #
    # Measured live before adding, same discipline every other source's
    # query list uses: bare tech words with no "estagio"/"estagiario"
    # prefix ("ti", "dados", "tecnologia", "desenvolvimento", "programador")
    # returned ordinary (non-internship) job postings -- InfoJobs's search
    # does not implicitly restrict to internships the way `titleRequired`
    # does downstream, so the query itself has to ask for one. Prefixed
    # multi-word terms fared little better: "estagio desenvolvimento",
    # "estagio dados" and "estagio seguranca da informacao" all returned
    # the same generic, mostly off-track set as a bare "estagio" search --
    # only "ti" reliably narrows the result set (4-20 real, on-track-titled
    # hits per query, sampled). Revisit if InfoJobs's own search behavior
    # changes.
    - source: infojobs
      jobName: estagio ti
      city: Rio de Janeiro
    - source: infojobs
      jobName: estagiario ti
      city: Rio de Janeiro
    - source: infojobs
      jobName: estagio ti
      isRemoteWork: true
    - source: infojobs
      jobName: estagiario ti
      isRemoteWork: true
    # Re-probed 2026-08-26 (ADR-070) now that `probe:terms` can measure this
    # source directly (ADR-069), against the two remote queries above:
    #   estagio desenvolvimento   11 returned, 1 on-track
    #   estagio suporte           11 returned, 0
    #   estagio dados              8 returned, 1 on-track
    # Neither non-zero term ships. Checking overlap -- the same check ADR-063
    # ran on its own candidates -- both contribute exactly ZERO postings the
    # two terms above do not already return: the single hit each is Lojas
    # Quero-Quero's "Estagiário de Programação", which `estagio ti` and
    # `estagiario ti` both already bring in. Adding them would spend two more
    # queries, at two HTTP requests per posting, for no discovery at all.
    # Also measured, and it validates what ships: `estagiario ti` returns a
    # strict superset of `estagio ti` (5 passing against 2).
    # --- NerdIn (ADR-071), added 2026-08-27 --------------------------------
    # An IT-only Brazilian board. Its detail pages carry a complete
    # schema.org JobPosting, including `jobLocationType: TELECOMMUTE` and
    # `addressCountry`, so `workMode` and `country` are read from the source
    # rather than inferred from which facet the query used.
    #
    # ONE query, and the measurement is why. `npm run probe:terms --source
    # nerdin --max 30`, against the live site:
    #
    #   term          scope        returned  passes  on-track  in-region
    #   estagi        site-wide           9       2         2          2
    #   estagio       site-wide           6       1         1          1
    #   estagiario    site-wide           3       1         1          1
    #   estagi        home-office         4       2         2          2
    #   estagi        Rio de Janeiro      1       0         0          0
    #
    # `estagi` is the prefix that unions `estagio` and `estagiario` (9 = 6 +
    # 3, and it reaches one posting `estagio` alone misses), so it replaces
    # both. The home-office variant is NOT added: it returns 4 and yields
    # the same 2 the site-wide query already contains -- the redundancy test
    # ADR-070 used to reject three other candidate queries. Rio de Janeiro
    # is genuinely empty here, not filtered wrong: `busca_local` was
    # verified honoured (194 -> 8 for Rio, -> 0 for a nonexistent city).
    #
    # `maxResults: 20` because each posting costs a second request (listing
    # -> detail), the same cost model InfoJobs has.
    - source: nerdin
      jobName: estagi
      maxResults: 20
    # Niterói/São Gonçalo not yet measured for this source -- cheap to add
    # (a city-slug change only) once probed with the same discipline as
    # Rio de Janeiro above. Not an oversight; deferred pending a real
    # measurement, matching Gupy's own "the remaining cities... measured
    # deliberately, not an oversight" precedent.
    # --- Sólides: parked, and re-confirmed parked 2026-08-26 (ADR-070) -----
    # Remote queries were the obvious second chance -- the collector, schema,
    # normalizer and both registry entries are intact, and the normalizer
    # already maps `homeOffice: true` to `workMode: remote`, so this would
    # have been config-only. Measured with `probe:terms --source solides
    # --remote` over three terms: 120 postings returned, 0 passed the
    # pre-filter, and every row came back `onsite` -- the source does not
    # honour the remote parameter at all. Content was off-area regardless
    # (marketing, administrativo, direito, engenharia mecânica, "MENOR
    # APRENDIZ"). Do not try remote queries here again without first
    # re-checking whether the parameter started being honoured.
    # --- Sólides: parked, 2026-08-23 (ADR-031 Amendment 1) -----------------
    # The nine queries this source used to run here (estágio/estagiário/
    # estagiária x Rio/Niterói/São Gonçalo) are removed, not merely
    # commented out -- measured at zero real yield across two full weeks in
    # production (`npm run report:supply`) and confirmed, not assumed, with
    # five tech-specific probe terms against the live API: the one real
    # Rio-area, dev-track hit found ("Estagiário de Banco de Dados | DBA |
    # SQL Server", Barra Olímpica) carries a `createdAt` of 2026-01-13 --
    # eight months stale, failing `maxAgeDays` decisively regardless of
    # interpretation. `SolidesCollector`/`solides-schema.ts`/
    # `solides-normalizer.ts` and both registry entries are left in place,
    # untouched -- this is a query-budget decision, not a code retirement,
    # and re-adding queries here is the entire reversal cost. Full
    # measurement and the revisit trigger: ADR-031 Amendment 1.
  # Pause between queries. The collector's own ~1.5s interval only spaces out
  # pages within one query (CLAUDE.md 6).
  queryIntervalMs: 1500
  # Only keep postings the source published in the last day (ADR-019).
  # Collection runs every few hours, so one day is already generous overlap.
  # A posting with no stated publication date passes -- absence of a date is
  # not evidence of an old posting.
  recencyDays: 1
  # Used only when there is no successful collect run on record: a first run
  # has no earlier cycle to have caught the past week.
  backfillDays: 7

titleBlocklist:
  - sênior
  - senior
  - pleno
  - especialista
  - coordenador
  - gerente
  - tech lead
  - III
  - IV

# Matched as whole words, not substrings (src/prefilter/domain/title-match.ts,
# ADR-011 Amendment 1) — so every inflected form that should match has to be
# listed here rather than inferred. Plurals are real: "Banco de Talentos - TI
# - Estágios e Efetivos" is a genuine posting that "estágio" alone misses.
#
# "intern" is deliberately NOT here as a bare term: as a whole word it is
# correct, but it was the substring that used to match "interna", "internos"
# and "International" and let non-internships through. "internship" is the
# unambiguous English form.
titleRequired:
  - estágio
  - estágios
  - estagiário
  - estagiários
  - estagiária
  - estagiárias
  - intern
  - interns
  - internship
  - internships
  - trainee
  - trainees

location:
  # Rio de Janeiro and metropolitan region (CLAUDE.md §6).
  cities:
    - Rio de Janeiro
    - Niterói
    - São Gonçalo
    - Duque de Caxias
    - Nova Iguaçu
    - Belford Roxo
    - São João de Meriti
    - Itaboraí
    - Maricá
    - Mesquita
  allowRemote: true
  # Sources with no server-side location filter -- an unknown-city posting
  # from one of these is not "cannot be ruled out," it is "the city-parsing
  # regex failed on a nationwide crawl" (docs/audit AC-024). Catho has no
  # per-city search and no traffic today (403-blocked, ADR-033) -- this is
  # a deliberate default in place before it is ever deployed. CIEE is here
  # too (docs/audit PR-016, ADR-011 Amendment 7): its one query above
  # (line 106) sets no city on purpose, sweeping the whole national board
  # -- an unknown city from it is not "probably Rio," it is "anywhere in
  # Brazil the parser could not read."
  nationwideSources:
    - catho
    - ciee

blockedCompanies: []

# Minimum count of profile keywords that must appear in a posting's title
# (Posting has no description field yet — the check is title-only today,
# see src/prefilter/domain/pre-filter.ts) before it is worth stage A/B's LLM
# budget.
#
# Set to 0 after a real Gupy run (2026-08-14) showed this rejecting real,
# on-track postings — e.g. "Estágio em Desenvolvimento Backend" (remote,
# track dev) — because a short title rarely repeats a specific competency
# name like "Node.js" or "TypeScript" verbatim. Revisit once Posting carries
# a description stage A can read, or once track classification alone proves
# too coarse a signal.
minKeywordAdherence: 0

# Reject a posting older than this many days before it reaches the LLM
# (measured from publishedAt when the source states one, firstSeenAt when it
# does not -- src/prefilter/domain/pre-filter.ts). null disables the rule.
# This is a considered exception to ADR-011's leniency rule ("an unknown axis
# passes") -- age is the one axis where absence of evidence should not rescue
# a posting, because the fallback (firstSeenAt) only ever under-estimates it.
#
# 7. Set to a week, not left null, on purpose: scoring an already-week-old
# posting spends real LLM budget on something increasingly likely to be
# filled or closed by the time it reaches the digest.
#
# Measured 2026-08-16 at the moment this was set: 100% of CIEE's 2,079 active
# postings and 78% of Gupy's carry no publishedAt at all, so today this rule
# does almost nothing -- every CIEE posting from the 2026-08-16 bulk import
# shares one firstSeenAt, and none of them are 7 days old yet. It is a bound
# on how old the corpus is allowed to get from here, not a cut to the
# backlog that exists today. It starts acting once a week has passed.
maxAgeDays: 7

# Business rule (ADR-011 Amendment 5): an undated posting first seen at or
# before this instant is presumed already past maxAgeDays, unconditionally --
# not measured against firstSeenAt, just treated as stale. Distinguishes the
# 2026-08-16 backlog (2,079 CIEE postings that will never get a publishedAt,
# all sharing one firstSeenAt from the bulk import) from postings that enter
# afterward through ordinary collection, which still get the normal
# maxAgeDays grace period via firstSeenAt -- unaffected by this line.
#
# Set once, to the moment this policy was adopted, and left in place. Not a
# value to keep bumping forward: everything collected up to here is "the
# backlog this rule exists to clear," everything after is "entering," and
# that dividing line does not move.
undatedBacklogCutoverAt: "2026-08-16T12:15:00Z"

# ADR-066. A posting the source was still listing on its most recent sweep is
# still open, whatever its publication date says — and `lastSeenAt` records
# exactly that, on every sighting, since ADR-007. The two rules above ask a
# proxy question ("how long ago was it published"); this one reads the direct
# answer, and wins over both when it is available.
#
# Measured on the real corpus, 2026-08-26, with the real pre-filter: of 26
# on-track, never-notified Rio-metro postings that `maxAgeDays: 7` rejected,
# 8 were still being listed by their source and 18 had genuinely vanished.
# The 8 include "Estágio em TI" (BHG, Rio, published 21d ago, seen 7h ago),
# "Estagiário de Tecnologia da Informação" (Phoenix Evolution, Rio, 15d/7h),
# and two CIEE "Estágio em Informática" in Rio seen 54 minutes earlier —
# those two were being rejected by `undatedBacklogCutoverAt`, having been
# first seen 8 hours before the cutover instant and advertised ever since.
#
# 30 hours, not less: gupy/ciee/infojobs are swept every 4h, but Indeed runs
# on its own systemd timer twice a day, so a still-listed Indeed posting can
# legitimately show a 12h-old `lastSeenAt`. 30h clears one full Indeed cycle
# plus a missed one. Too short and a live posting reads as gone purely
# because its source has not been swept; too long and the evidence stops
# meaning "right now". If a source stops collecting entirely, its postings
# simply age out again — the failure mode is the old behaviour, not a leak.
#
# Only ever rescues a posting, never rejects one: a paginating source drops
# still-open postings out of the collected window (`truncatedSources:
# ["gupy"]` appears on most real runs), so "not seen recently" is not
# evidence of closure. null disables this entirely.
stillListedWithinHours: 30

# ADR-068. Which country's postings can actually be taken, and how the nightly
# scoring budget is split along that line.
#
# `homeCountry` is where the profile can be hired. A posting from here is
# "national" and is NEVER capped -- it is eligible by construction, and its
# measured worth is high: on the real corpus (2026-08-26) remote postings
# delivered at 21.4% (42 collected, 9 delivered) against 1.4% for onsite.
#
# An international posting is a different kind of thing: it has to be
# *evaluated* to find out whether it can be taken from Brazil at all. A
# residency or visa requirement becomes a `blocking` requirement in Stage A
# and caps the score at `blockingCapScore` -- the mechanism already exists and
# needs no new rule. What it costs is a model call per posting, spent whether
# the answer turns out to be yes or no. `maxInternationalPerRun` bounds how
# many of those guesses one night pays for; national postings are never
# counted against it.
#
# `null` disables the cap. Left null today ON PURPOSE: no international source
# is wired up yet, so every posting in the corpus is national and a number
# here would be untested config pretending to be a measurement. It gets a real
# value in the same PR that adds the first international source, measured the
# way every other number in this file was.
homeCountry: BR
maxInternationalPerRun: null

# The country a source's postings belong to when the posting itself states
# none -- a property of the SOURCE, not a guess about the posting, the same
# standing `location.nationwideSources` already has.
#
# Every source wired up today is a Brazilian platform, and most state no
# country at all: gupy/ciee/solides publish no country field, InfoJobs's
# JSON-LD carries `addressCountry` only sometimes, and Indeed's collector pins
# `country_indeed="Brazil"` (`collectors/indeed/collect.py`). Without this map
# the entire existing corpus would read as "unplaceable" and fall into the
# capped international bucket -- the exact inversion of the priority above.
#
# A source absent from here whose postings state no country is treated as
# international, deliberately: an unplaceable posting should compete for the
# bounded budget, not the unbounded one.
sourceDefaultCountry:
  gupy: BR
  ciee: BR
  infojobs: BR
  nerdin: BR
  solides: BR
  indeed: BR
  catho: BR
  linkedin: BR

# How far into the future a source's publishedAt is still trusted
# (docs/audit AC-029). Beyond this, it is treated as an unreliable date --
# clock skew, a misparsed format, a bad value like the year 2099 -- not
# evidence of freshness, and isTooOld falls back to firstSeenAt instead.
# 1 day is generous enough to absorb ordinary timezone differences.
maxFutureSkewDays: 1

# Keyword classification per track, feeding trackAlignment (docs/04). A
# posting matching a track's list is classified into it; matching none
# leaves it unknown (trackWeights.unknown), not rejected.
tracks:
  dev:
    - backend
    - back-end
    - back end
    - node
    - node.js
    - nodejs
    - typescript
    - javascript
    - api
    - apis
    - desenvolvimento
    - desenvolvedor
    - software
    - fullstack
    - full-stack
    - programação
    - programador
    # Vocabulario do CIEE, nao da Gupy: a categoria de tecnologia deles chama
    # "Informatica", e sem esta entrada as 6 vagas de TI do CIEE que passam o
    # pre-filtro classificavam como `unknown` e pontuavam 0.4 de alinhamento.
    - informática
    # Added 2026-08-22 (docs/11-known-issues.md B10), measured against the
    # real 2,976-posting corpus with the same probe discipline as every
    # entry above: whole-phrase, on-track, no false positives sampled.
    #   banco de dados / sql server   1 match each (Confitec — "Estagiário
    #     em Banco de Dados SQL Server"), the same posting -- a real
    #     backend/database internship the profile has evidenced SQL/
    #     PostgreSQL competencies for, classifying `unknown` and being
    #     rejected by `rejectUnknownTrack` before it ever reached a human.
    #   sistemas de informação / ciência da computação / redes de
    #     computadores   1 match each, all on the same CEPEL posting
    #     ("Estágio | Redes de Computadores, Sistemas de Informação,
    #     Ciência da Computação e afins") -- CEPEL's own catch-all phrasing
    #     for "any CS-adjacent degree," the formal course names rather than
    #     generic words, so the false-positive risk that ruled out bare
    #     "dados" (5/7 matches off-track: accounting, HR, academic support)
    #     does not apply here.
    - banco de dados
    - sql server
    - sistemas de informação
    - ciência da computação
    - redes de computadores
    # Added 2026-08-23 (docs/11-known-issues.md B13's follow-up), measured
    # against the full 2,768-posting corpus with the same probe discipline:
    # whole-word, on-track, no false positives sampled.
    #   ia / inteligência artificial   1 + 2 matches, all on-track (V3A —
    #     "Estagiário(a) em Dados e IA"; Magnetis — "Estágio em Inteligência
    #     Artificial"; Instituto Infnet — "...Dados e Inteligência
    #     Artificial"). "ia" is a short token but whole-word matching found
    #     zero substring bleed into "Fisioterapia", "Farmácia" or similar
    #     across the whole corpus -- the same check that ruled bare "dados"
    #     in/out for B10.
    #
    # Deliberately NOT added: bare "tecnologia". Measured 8 matches, but 6
    # already classify via the existing "tecnologia da informação" phrase --
    # the only genuine gain was "FGV - ESTÁGIO - TECNOLOGIA" against one real
    # false positive, "ESTAGIÁRIO NA ÁREA DE ENGENHARIA ELÉTRICA... (CET
    # Brazil Equipamentos de Energia Elétrica e Tecnologia)", where the word
    # appears only in the company's own name, not the job content -- the
    # same shape B8 already fixed once for "(Humano Desenvolvimento)".
    - ia
    - inteligência artificial
  security:
    - segurança
    - security
    - infraestrutura
    - infrastructure
    - firewall
    - siem
    - soc
    - pentest
    - cibersegurança
    - ciber
  automation:
    - automação
    - automation
    - devops
    - sre
    - ci/cd
    - cicd
    - terraform
    - ansible
    - kubernetes
    - docker
    # Generic IT-support/infra vocabulary (ADR-051 Amendment 1), measured
    # with `npm run probe:terms`-style whole-word matching against the real
    # corpus before adding: "TI" 61 matches, all genuinely IT (helpdesk,
    # infra, sysadmin) with zero false positives sampled; "tecnologia da
    # informação" and "suporte a sistemas" 1 match each, "service desk" 2,
    # "suporte técnico" 3. Placed under automation (0.7), not security
    # (1.0) -- these are IT-operations-flavored, not information-security
    # work, and CLAUDE.md's own priority split already puts
    # infrastructure/automation a tier below security. "help desk" and
    # "helpdesk" measured zero matches on the current corpus -- not added,
    # per ADR-011's discipline of only listing measured, non-zero terms.
    - ti
    - tecnologia da informação
    - suporte a sistemas
    - service desk
    - suporte técnico
    # Added 2026-08-18, same probe discipline as the block above, against
    # that day's fresh 2,513-posting corpus (prefilter-calibration-followup
    # audit): "suporte e operações" 1 match, on-track (Phoebus Tecnologia —
    # "Estagiário de Suporte e Operações"), zero false positives. The bare
    # words are deliberately NOT listed: "suporte" alone returns 5 matches
    # and "operações" alone 7, both mostly off-track noise (academic
    # support, hospital/logistics/education "operações") -- exactly the
    # false-positive risk ADR-011's whole-phrase discipline exists to avoid.
    - suporte e operações
    # Added 2026-08-23 (docs/11-known-issues.md B13's follow-up). English
    # "IT" -- different letters from Portuguese "ti" just above, so it never
    # matched via that entry. 1 match, on-track (HMH -- "IT Support Intern"),
    # measured against the full corpus with zero false positives.
    - it
  # Added 2026-08-23 (ADR-061), a lower-priority track of its own rather
  # than folded into `dev` -- CLAUDE.md §1's search profile names only
  # back-end, security and infrastructure/automation, not data analysis, so
  # `trackWeights.data` sits at `automation`'s 0.7, not `dev`'s 1.0.
  #
  # Every phrase here was measured against the real production corpus
  # (`docker exec` read-only query, same method B10/B13 use), whole-word,
  # on-track, false-positive-checked -- bare "dados" was deliberately
  # rejected, the same call B10 already made for the `dev` track and for
  # the same reason: 2 of 11 real matches were off-track ("Estagiário
  # Administrativo (Dados)", "Pessoa Estagiária de Dados Para Suporte e
  # Atendimento ao Cliente" -- a customer-support role, not a data role).
  # None of the five phrases below match either false positive.
  data:
    - análise de dados
    - data analytics
    - pessoa estagiária de dados
    - governança de dados
    - inteligência de dados
    # Measured and deliberately NOT added: "engenheiro(a) de dados" -- a
    # real, valuable title pattern seen live against Gupy's API (Visagio's
    # RJ/SP/NE postings), but zero occurrences in the *stored* corpus this
    # classifier actually runs against (none of the current collection
    # queries happen to have pulled it in yet) -- nothing to measure a
    # false-positive rate against. Revisit once one is actually collected.

# Phrases that veto a track even when one of its keywords matched (ADR-015).
# Every entry below was observed as a real false positive in the collected
# corpus, not imagined: "desenvolvimento" is the single most overloaded word
# in Brazilian job titles, and "segurança do trabalho" is a different
# profession from information security.
#
# Deliberately NOT excluded, because they are genuinely dev: "desenvolvimento
# backend", "desenvolvimento web", "desenvolvimento de sistemas",
# "desenvolvimento full stack", "análise e desenvolvimento de sistemas".
trackExclusions:
  dev:
    - desenvolvimento de embalagens
    - desenvolvimento humano
    - desenvolvimento organizacional
    - treinamento e desenvolvimento
    - desenvolvimento de produto
    - desenvolvimento de produtos
    - desenvolvimento comercial
    - desenvolvimento de negócios
    - desenvolvimento de mercado
    - desenvolvimento técnico de mercado
    - desenvolvimento de fornecedores
    - desenvolvimento imobiliário
    - desenvolvimento infantil
    - desenvolvimento educacional
    - desenvolvimento de motoristas
    - desenvolvimento de rede
    - desenvolvimento farmacotécnico
    - desenvolvimento analítico
    - desenvolvimento do cooperativismo
    - desenvolvimento de arte
    - desenvolvimento de projetos de engenharia
    - pesquisa e desenvolvimento
    # "Pesquisa & Desenvolvimento" (2026-08-19, Duty Cosméticos — a cosmetics
    # R&D internship requiring Química/Farmácia/Engenharia Química): the "&"
    # normalizes to a bare space, not "e", so it never matched "pesquisa e
    # desenvolvimento" above despite being the same phrase in practice.
    - pesquisa desenvolvimento
    - desenvolvimento de canais
    - desenvolvimento de embalagem
    # "(Humano Desenvolvimento)" (2026-08-19, Jobbol — a Psychology
    # internship where this is the staffing agency's own name, reversed
    # word order from "desenvolvimento humano" above): word order is
    # literal in this matcher (title-match.ts), so the canonical phrasing
    # does not cover its own reversal.
    - humano desenvolvimento
  security:
    - segurança do trabalho
    - segurança patrimonial
    - segurança predial
    - técnico de segurança
    - segurança alimentar
  data:
    # "PESSOA ESTAGIÁRIA DE DADOS PARA SUPORTE E ATENDIMENTO AO CLIENTE"
    # (2026-08-23, Quality Digital): a customer-support role, matched by
    # "pessoa estagiária de dados" above only because that phrase happens
    # to be this posting's own opening words -- the real job is support,
    # not data.
    - suporte e atendimento ao cliente

# Reject a posting pre-LLM when its title matches none of the tracks above
# (ADR-051). Measured on the 2026-08-17 calibration run: of the 28 postings
# that passed the pre-filter, all 28 classified unknown -- none matched dev,
# security or automation -- and the delivered digest was Segurança do
# Trabalho, Jurídico, RH, Marketing, Contabilidade, Design, Fisioterapia and
# similar, not one genuine backend/security/infra posting among them.
# unknownTrackCapScore below still exists and still applies if this is ever
# turned back off.
rejectUnknownTrack: true

# Provisional until M7 calibration (docs/04-scoring-model.md). dev and
# security share 1.0 — equal first priorities (docs/01-vision-and-scope.md).
# data (ADR-061) shares automation's 0.7 -- a real, visible track, but not
# one of CLAUDE.md §1's priority-1 targets.
trackWeights:
  dev: 1.0
  security: 1.0
  automation: 0.7
  data: 0.7
  unknown: 0.4

# Stage C's formula (docs/04-scoring-model.md). Provisional until M7
# calibration — every number here is a starting hypothesis, not a result.
#
# Recalibrated 2026-08-16 (ADR-005 Amendment 1, ADR-026), from 65/20/15.
# Requested directly after the first real digest: two genuine dev postings
# with real gaps (missing Angular, Java/Spring, or C#/Go) scored only 63 --
# review, not apply -- because mandatoryCoverage dominated the formula at
# 65%, leaving trackAlignment's 15% unable to reflect "the right kind of
# role" strongly enough. Track fit now counts for nearly as much as meeting
# the posting's own stated requirements. See ADR-026 for the full trade-off:
# an on-track posting meeting almost none of its requirements now scores
# ~45 on track alone (was ~15), close to the review threshold.
scoring:
  weights:
    mandatory: 35
    desirable: 20
    trackAlignment: 45
  thresholds:
    apply: 70
    review: 45
  # Fewer extracted requirements than this triggers lowConfidence, capping
  # the verdict at review — see docs/04's "empty posting" edge case.
  minExtractedRequirements: 1
  # Score ceiling when a blocking requirement fails (docs/04).
  blockingCapScore: 35
  # Score ceiling when a posting matches no configured track (ADR-025).
  # trackAlignment alone is only 15% of the formula -- not enough to stop a
  # generic, easy-to-satisfy posting (customer service, HR, sales) from
  # scoring near the top on coverage alone. Measured on a real digest
  # 2026-08-16: an HR "Benefícios" internship scored 91 and verdict apply,
  # ahead of genuine dev postings at 63 review, because mandatoryCoverage
  # and desirableCoverage both hit 1.00 -- a generic posting has little to
  # fail against. 50 sits in the middle of the review band (45-69): still
  # visible (an unknown track is a classifier gap, not necessarily a bad
  # posting -- docs/04), never mistaken for a strong match again.
  unknownTrackCapScore: 50
  # How many stage B requirement calls run at once (ADR-022). Stage B is one
  # call per requirement and ~25 requirements per posting, so sequential it
  # measured 213.8s for a single posting -- roughly 18h to score the 310
  # postings that currently pass the pre-filter. Changes timing only; the
  # model sees exactly the same prompt per requirement either way.
  #
  # Raise it if the nightly window is still too long, but read ADR-022 first:
  # the first call of each posting is issued alone on purpose, and stage B's
  # cache prefix is what makes the cost per posting cents rather than dollars.
  stageBConcurrency: 8
  # OpenRouter provider slugs never to route to (ADR-056), sent as
  # `provider.ignore`. ADR-013 pinned the model; it did not pin which of the
  # 30 providers serving that model answers a given request, so "same model,
  # same prompt" could still mean two different systems run to run.
  #
  # Every entry is a measured observation against this project's own corpus,
  # never a reputation guess -- the same discipline `blockedCompanies` and
  # `trackExclusions` follow:
  #
  #   sail-research  2026-08-22. Isolated single calls with the *production*
  #                  b-v4 prompt: 0 of 8 usable. Returned `finish: "stop"`
  #                  with completely empty content, or blew the 768-token
  #                  completion budget with 2,400-3,700 characters of
  #                  reasoning against an explicit `reasoning.max_tokens:
  #                  300`. It advertises full support for both `max_tokens`
  #                  and `reasoning` in OpenRouter's own endpoints API,
  #                  which is why `provider.require_parameters: true` does
  #                  NOT exclude it (measured: 0/8 usable with that flag
  #                  set). Excluding it by name is the only lever that
  #                  worked -- 4/4 usable immediately after.
  #
  # Measured good on the same probe, for the record, so a future session does
  # not re-test them blind: Baidu, OpenInference, Relace. Deliberately NOT an
  # allowlist -- a list of "known good" providers goes stale silently as
  # OpenRouter's roster changes, while an exclusion list fails safe (an
  # unknown new provider is tried, and only excluded once actually observed
  # failing).
  ignoredProviders:
    - sail-research

# Two independent crons (ADR-009, M8). Collection is frequent and cheap — no
# LLM. Scoring and delivery run once nightly, in an off-peak window, because
# that is the only point where the model (and its resource cost) runs.
schedule:
  collection:
    intervalHours: 4
  scoreAndDeliver:
    time: "03:00"
    timezone: America/Sao_Paulo

# docs/08-observability.md. Delivered through the same Telegram notifier as
# the digest — a separate alerting channel for a personal project would be
# infrastructure nobody maintains.
alerts:
  # Collection is frequent, so one empty cycle is routine; alert only after
  # this many in a row.
  consecutiveEmptyCollectionRuns: 2
  # Share of scoring attempts failing (ADR-006) in a single deliver run
  # above which the run itself is worth flagging as a possible model or
  # prompt regression.
  scoreFailureRateThreshold: 0.5
  # How long each source may deliver nothing before that is an alert
  # (docs/11-known-issues.md B13). This is the ONLY signal that can see a
  # push-based external collector go silent: Indeed (ADR-027) never appears
  # in a collect run's `attempted_sources`, so it contributed zero postings
  # for six days while every run row, the empty-collection check and the
  # missed-run alert all reported green -- the pulled sources really were
  # healthy, and nothing was watching the pushed one.
  #
  # Windows are set from each source's real cadence with slack for one
  # missed cycle, not from wishes:
  #   gupy/ciee/infojobs  pulled every 4h by the scheduler (ADR-009), but
  #              volume is lumpy, so 72h flags a dead collector without
  #              crying over a quiet weekend.
  #   indeed     its own systemd timer runs twice daily; 36h is a little
  #              over one missed run.
  #   linkedin   REMOVED 2026-08-26 (ADR-064). It was 96h, set from the real
  #              ingest cadence, and it fired correctly -- `linkedin` has
  #              never delivered a posting, so `evaluateSourceFreshness`'s
  #              "never delivered" branch matched on every collection run,
  #              six times a day, about a fact that does not change between
  #              runs. That is not a signal, it is a metronome, and its cost
  #              is real: an alert channel nobody can bear to read stops
  #              working for the outage it exists to catch.
  #
  #              This is NOT `catho`'s reasoning below. LinkedIn is deployed
  #              and n8n is delivering (HTTP 201, 37 items over five runs);
  #              every one is rejected at normalization instead. Removing
  #              this line silences the symptom knowingly, and would leave
  #              the loss invisible if it stood alone -- so it does not:
  #              `linkShape` (same ADR) makes the next real ingest record
  #              why, and B15 in docs/11 stays open until a `linkedin` row
  #              appears in `postings`. Restore this window the day that
  #              happens; a source that has delivered once can go stale, and
  #              then the window is a signal again.
  #
  # `catho` is deliberately absent: it has never been deployed (B14), and
  # listing it would alert every cycle about a decision nobody has made yet.
  # `solides` was here (72h) until 2026-08-23: its nine queries are parked
  # (ADR-031 Amendment 1, see `collection.queries` above), so it no longer
  # runs and listing it would alert about a decision already made, the same
  # reasoning that keeps `catho` off this list. An unlisted source is
  # simply not checked.
  sourceFreshnessHours:
    gupy: 72
    ciee: 72
    infojobs: 72
    indeed: 36
