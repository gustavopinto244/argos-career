name: job-radar

services:
  job-radar:
    build:
      context: .
      dockerfile: Dockerfile
    image: job-radar:local
    container_name: job-radar
    restart: unless-stopped
    env_file: .env.job-radar
    environment:
      DATABASE_PATH: /app/data/job-radar.db
      JOB_RADAR_CONFIG_PATH: /app/config/job-radar.yaml
    volumes:
      - radar-data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  radar-data:
